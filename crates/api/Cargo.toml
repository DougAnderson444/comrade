[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
comrade-core.workspace = true
wit-bindgen-rt = { version = "0.41.0", features = ["bitflags"] }
multikey = { version = "1.0", git = "https://github.com/cryptidtech/bs.git", default-features = false }
multisig = { version = "1.0", git = "https://github.com/cryptidtech/bs.git" }
multihash = { version = "1.0", git = "https://github.com/cryptidtech/bs.git" }
multiutil = { version = "1.0", git = "https://github.com/cryptidtech/bs.git" }
getrandom = { version = "0.2", features = ["custom"] }
pest = "2.8"
pest_derive = "2.8"
thiserror = "2.0"

[dev-dependencies]
comrade-core.workspace = true
wasm_component_layer = { workspace = true }
wasmi_runtime_layer = "0.40.0"
hex = "0.4"
rand = "0.8.5"
chrono = { version = "0.4.19", default-features = false, features = ["clock"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "component:api"

[package.metadata.component.dependencies]
